name: Release

# 打 tag（v*）触发发版；也可以在 Actions 页面手动跑一次出 draft
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # tauri-action 要建 Release、传产物

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台挂了别连坐
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # macOS 两种 CPU 各出一枚 DMG（Intel 与 Apple Silicon）
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 交叉目标要在工具链里一并装上
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: 装 Linux 依赖（WebKitGTK 4.1 一族）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 装 npm 依赖
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GeometryLab ${{ github.ref_name }}'
          releaseBody: '桌面安装包在下方 Assets：Windows 是 -setup.exe（NSIS，每用户安装），macOS 按芯片选 .dmg，Linux 有 .deb 与 .AppImage。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
